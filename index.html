/* 업무 모드 소재 보드: 요약 정의 목록, 미디어믹스 표, 고정 툴바, 캠페인 구획별 소재 그리드 */
:root{
  --bg:#f4f4f2; --surface:#ffffff; --ink:#141413; --mute:#5c5c58; --rule:#dcdcd8; --rule-strong:#141413;
  --h1:#ececea; --h2:#cfcfca; --hot:#c4161c; --sel:#d6d6d1;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111111; --surface:#1a1a1a; --ink:#ededeb; --mute:#a3a3a0; --rule:#2f2f2e; --rule-strong:#ededeb;
  --h1:#242424; --h2:#3b3b3a; --hot:#ff7a72; --sel:#3b3b3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --surface:#1a1a1a; --ink:#ededeb; --mute:#a3a3a0; --rule:#2f2f2e; --rule-strong:#ededeb;
  --h1:#242424; --h2:#3b3b3a; --hot:#ff7a72; --sel:#3b3b3a; color-scheme:dark}
*{letter-spacing:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;scrollbar-color:var(--h2) var(--bg)}
::selection{background:var(--sel);color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button{font:inherit;color:inherit}
.wrap{max-width:none;margin:0;padding-block:32px 80px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:32px}
h1{font-size:28px;font-weight:700;line-height:1.25;margin:0}
h2{font-size:18px;font-weight:700;margin:0}
h3{font-size:15px;font-weight:600;margin:0;overflow-wrap:anywhere}
.cap-t{font-size:12px;color:var(--mute)}
/* 요약 */
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px;margin:0;border-top:1px solid var(--rule-strong)}
.sum div{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.sum dt{font-size:12px;color:var(--mute);padding-top:1px}
.sum dd{margin:0;font-size:14px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.sum dd small{display:block;font-size:12px;font-weight:400;color:var(--mute)}
@media (max-width:820px){.sum{grid-template-columns:1fr}}
/* 미디어믹스 */
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.tbl{overflow-x:auto;border-top:1px solid var(--rule-strong)}
table.mm{border-collapse:collapse;font-size:12px;min-width:1200px;width:100%}
.mm th,.mm td{border-bottom:1px solid var(--rule);padding:7px 6px;text-align:right;white-space:nowrap}
.mm th{font-weight:400;color:var(--mute)}
.mm th.ev{color:var(--ink);font-weight:700}
.mm .l{text-align:left}
.mm td.code{font-weight:600}
.mm .lv1{color:var(--mute)} .mm .lv2{font-weight:700} .mm .lv3{font-weight:700;color:var(--hot)}
.mm tr.grp td{font-weight:600;background:var(--surface)}
.mm tr.tot td{font-weight:700;border-top:1px solid var(--rule-strong);border-bottom:0}
/* 툴바 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-block:12px;border-bottom:1px solid var(--rule)}
.bar-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.jump{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px}
.jump[hidden]{display:none}
.jump button{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;font-size:12px;white-space:nowrap}
.jump button b{font-weight:700}
.jump button:hover{border-color:var(--ink)}
.jump button[aria-current="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--rule);background:var(--surface)}
.seg button{min-height:40px;padding:0 16px;border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.btn{min-height:40px;padding:0 16px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--surface)}
.btn:hover{background:var(--h1)} .btn.primary:hover{opacity:.88;background:var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
.btn[hidden]{display:none}
/* 구획 */
.grp-t{padding-top:16px}
.camp{display:flex;flex-direction:column;gap:16px;padding-top:24px;border-top:1px solid var(--rule-strong)}
.camp-h{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.ct{display:flex;flex-direction:column;gap:4px;min-width:0}
.ct .nm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.meta{font-size:13px;color:var(--mute)}
.badge{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;font-size:12px;font-weight:600;border:1px solid var(--ink);color:var(--ink);white-space:nowrap}
.badge.new{background:var(--ink);color:var(--surface)}
.ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
.ad{background:var(--surface);border:1px solid var(--rule);display:flex;flex-direction:column;min-width:0}
.ad.new{border:2px solid var(--ink)}
.thumb{border:0;padding:0;background:none;cursor:zoom-in;display:block}
.thumb img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--h1)}
.bd{padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.id{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px}
.id b{font-weight:700}
.id span{color:var(--mute)}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.k{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.v{font-size:13px;overflow-wrap:anywhere}
.v.sub{color:var(--mute);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lines{display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.6}
.cp{min-height:28px;padding:0 10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;font-size:12px;white-space:nowrap}
.cp:hover{border-color:var(--ink)}

else{const ids=Object.keys(U).filter(k=>U[k].g===gg).sort();
h+='<section class="camp"><div class="camp-h"><div class="ct"><span class="meta">고유 소재 '+ids.length+'종</span></div></div><div class="ads">'+ids.map(id=>{let a=null;C.forEach(c=>c.ads.forEach(x=>{if(!a&&x.id===id)a=x;}));
return card(a,'<div class="f"><span class="k">사용 캠페인</span><span class="v">'+U[id].camps.join(' · ')+'</span></div>');}).join('')+'</div></section>';}
h+='</section>';});
L.innerHTML=h;showDl();buildJump();}
function buildJump(){const J=document.getElementById('jump');if(view!=='camp'){J.hidden=true;J.innerHTML='';return;}
const ok=x=>g==='all'||(g==='m'&&x==='남성')||(g==='w'&&x==='여성');
J.hidden=false;J.innerHTML=C.filter(c=>ok(G(c))).map(c=>'<button data-to="c-'+c.code+'"><b>'+c.code+'</b>'+esc(c.full.split('_')[1])+'</button>').join('');watchJump();}
document.getElementById('jump').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=document.getElementById(b.dataset.to);if(!t)return;
const bar=document.querySelector('.bar');const off=getComputedStyle(bar).position==='sticky'?bar.offsetHeight+12:12;
window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-off,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});});
let IO=null;function watchJump(){if(IO)IO.disconnect();if(!('IntersectionObserver' in window))return;
const bar=document.querySelector('.bar');IO=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){document.querySelectorAll('#jump button').forEach(b=>b.setAttribute('aria-current',b.dataset.to===en.target.id?'true':'false'));}});},{rootMargin:'-'+(bar.offsetHeight+20)+'px 0px -70% 0px'});
document.querySelectorAll('.camp[id]').forEach(s=>IO.observe(s));}
function setP(ids,on){ids.forEach(i=>document.getElementById(i).setAttribute('aria-pressed',i===on?'true':'false'));}
document.getElementById('v-camp').onclick=()=>{view='camp';setP(['v-camp','v-uniq'],'v-camp');render();};
document.getElementById('v-uniq').onclick=()=>{view='uniq';setP(['v-camp','v-uniq'],'v-uniq');render();};
[['g-all','all'],['g-m','m'],['g-w','w']].forEach(([i,v])=>document.getElementById(i).onclick=()=>{g=v;setP(['g-all','g-m','g-w'],i);render();});
function copyText(t,btn){const done=()=>{btn.textContent='복사됨';setTimeout(()=>btn.textContent='복사',1200);};
const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done();}catch(x){}a.remove();};
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fb);}else fb();}
const lb=document.getElementById('lb');
document.getElementById('list').addEventListener('click',e=>{const cp=e.target.closest('.cp');if(cp){copyText(cp.dataset.copy,cp);return;}
const b=e.target.closest('.thumb');if(!b)return;const u=U[b.dataset.id];
const im=document.getElementById('lbimg');im.src='orig_'+u.id+'.jpg';im.alt=u.id;const d=document.getElementById('lbdl');d.dataset.url='orig_'+u.id+'.jpg';d.dataset.name=u.file;
document.getElementById('lbcap').textContent=u.id+' · '+u.type+' · '+u.desc.replace(/_/g,' ')+' · 사용 '+u.camps.join(' · ');lb.hidden=false;document.getElementById('lbx').focus();});
const close=()=>{lb.hidden=true;};document.getElementById('lbx').onclick=close;lb.addEventListener('click',e=>{if(e.target===lb)close();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
function showDl(){document.querySelectorAll('.dlb').forEach(b=>{b.hidden=false;});}
const BC={};
async function getBlob(u){if(BC[u])return BC[u];const r=await fetch(u);if(!r.ok)throw {code:'fetch'};BC[u]=await r.blob();return BC[u];}
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
async function buildZip(k){if(!window.JSZip)throw {code:'unavailable'};const z=new JSZip();const cs=k==='ALL'?C:C.filter(c=>c.code===k);
for(const c of cs){const f=(k==='ALL'?G(c)+'/':'')+c.full;for(const a of c.ads){z.file(f+'/'+a.name+'.jpg',await getBlob('orig_'+a.id+'.jpg'));}
z.file(f+'/_광고문구_'+c.code+'.txt',await getBlob('txt_'+c.code+'.txt'));}
if(k==='ALL'){const rows=[['캠페인','세팅','기간','예산(원)','소재명','광고 시작','기본 텍스트','헤드라인','설명','CTA','URL']];
C.forEach(c=>c.ads.forEach(a=>rows.push([c.full,c.setting,c.period,c.budget,a.name,a.start,a.body,a.head,a.desc,a.cta,a.url])));
z.file('00_소재매핑표_무진장메타.csv','﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'));}
return await z.generateAsync({type:'blob',compression:'DEFLATE'});}
function webSave(b,name){const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}
async function saveFile(btn,src,name){if(btn.disabled)return;const t=btn.textContent;btn.disabled=true;btn.textContent='준비 중';
try{const b=typeof src==='function'?await src():await getBlob(src);if(DLR)await DLR.save({filename:name,data:b});else webSave(b,name);btn.textContent='저장됨';}
catch(e){btn.textContent=e&&e.code==='declined'?'취소됨':e&&e.code==='rate_limited'?'잠시 후 다시':'다운로드 불가';}
setTimeout(()=>{btn.textContent=t;btn.disabled=false;},1800);}
document.addEventListener('click',e=>{const b=e.target.closest('.dlb');if(!b)return;e.stopPropagation();
if(b.id==='lbdl')saveFile(b,b.dataset.url,b.dataset.name);else{const k=b.dataset.dl;saveFile(b,()=>buildZip(k),DL[k]);}},true);
mm();render();
(async()=>{try{DLR=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(x){DLR=null;}showDl();})();
</script></body></html>
